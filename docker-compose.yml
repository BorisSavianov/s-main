services:
  # Database Services
  postgres:
    image: ankane/pgvector:latest
    container_name: serenity_space_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infrastructure/postgres/migrations:/docker-entrypoint-initdb.d/migrations
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - serenity_space_network

  redis:
    image: redis:8-alpine
    container_name: serenity_space_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - serenity_space_network

  # AI Infrastructure
  ollama:
    image: ollama/ollama:latest
    container_name: serenity_space_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - '11434:11434'
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE}
      - OLLAMA_HOST=${OLLAMA_HOST}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11434/api/tags']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  # Core Backend Services
  auth-service:
    build:
      context: ./
      dockerfile: Dockerfile-auth
    container_name: serenity_space_auth
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT_AUTH}
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_SECURE=${MAIL_SECURE}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - FRONTEND_URL=${FRONTEND_URL}

    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification-service:
        condition: service_started

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  user-service:
    build:
      context: ./
      dockerfile: Dockerfile-user
    container_name: serenity_space_user
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT_AUTH}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_SECURE=${MAIL_SECURE}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - FRONTEND_URL=${FRONTEND_URL}
    ports:
      - '4001:4001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4001/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  chat-service:
    build:
      context: ./
      dockerfile: Dockerfile-chat
    container_name: serenity_space_chat
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT_CHAT=${PORT_CHAT}
      - PORT_AUTH=${PORT_AUTH}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_SECURE=${MAIL_SECURE}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - CRISIS_TEAM_EMAIL=${CRISIS_TEAM_EMAIL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX}
      - REDIS_BULL_DB=${REDIS_BULL_DB}
      - REDIS_SESSION_DB=${REDIS_SESSION_DB}
      - REDIS_CACHE_DB=${REDIS_CACHE_DB}
      - REDIS_TLS_ENABLED=${REDIS_TLS_ENABLED}
      - REDIS_TLS_REJECT_UNAUTHORIZED=${REDIS_TLS_REJECT_UNAUTHORIZED}
      - REDIS_TLS_CA=${REDIS_TLS_CA}
      - REDIS_TLS_CERT=${REDIS_TLS_CERT}
      - REDIS_TLS_KEY=${REDIS_TLS_KEY}
      - REDIS_SENTINEL_HOSTS=${REDIS_SENTINEL_HOSTS}
      - REDIS_SENTINEL_ENABLED=${REDIS_SENTINEL_ENABLED}
      - REDIS_SENTINEL_MASTER_NAME=${REDIS_SENTINEL_MASTER_NAME}
      - AI_PROVIDER=${AI_PROVIDER}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT}
      - OLLAMA_MAX_RETRIES=${OLLAMA_MAX_RETRIES}
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL}
      - OLLAMA_SENTIMENT_MODEL=${OLLAMA_SENTIMENT_MODEL}
      - OLLAMA_MODERATION_MODEL=${OLLAMA_MODERATION_MODEL}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE}
      - OLLAMA_TOP_P=${OLLAMA_TOP_P}
      - OLLAMA_MAX_TOKENS=${OLLAMA_MAX_TOKENS}
      - OLLAMA_STOP_TOKENS=${OLLAMA_STOP_TOKENS}
      - AI_SENTIMENT_ANALYSIS=${AI_SENTIMENT_ANALYSIS}
      - AI_CONTENT_MODERATION=${AI_CONTENT_MODERATION}
      - AI_SESSION_SUMMARY=${AI_SESSION_SUMMARY}
      - AI_RECOMMENDATIONS=${AI_RECOMMENDATIONS}
      - AI_EMBEDDING=${AI_EMBEDDING}
      - AI_TOPIC_EXTRACTION=${AI_TOPIC_EXTRACTION}
      - AI_MAX_MESSAGE_LENGTH=${AI_MAX_MESSAGE_LENGTH}
      - AI_MAX_SESSION_DURATION=${AI_MAX_SESSION_DURATION}
      - AI_MAX_MESSAGES_PER_SESSION=${AI_MAX_MESSAGES_PER_SESSION}
      - AI_RATE_LIMIT_PER_MINUTE=${AI_RATE_LIMIT_PER_MINUTE}
      - AI_SYSTEM_PROMPT=${AI_SYSTEM_PROMPT}
      - AI_SENTIMENT_PROMPT=${AI_SENTIMENT_PROMPT}
      - AI_MODERATION_PROMPT=${AI_MODERATION_PROMPT}
      - AI_SUMMARY_PROMPT=${AI_SUMMARY_PROMPT}
      - AI_RECOMMENDATION_PROMPT=${AI_RECOMMENDATION_PROMPT}
      - AUTH_SERVICE_HOST=${AUTH_SERVICE_HOST}
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT}
      - THROTTLE_SHORT_LIMIT=${THROTTLE_SHORT_LIMIT}
      - THROTTLE_MEDIUM_LIMIT=${THROTTLE_MEDIUM_LIMIT}
      - THROTTLE_LONG_LIMIT=${THROTTLE_LONG_LIMIT}
      - SENTIMENT_MODEL=${SENTIMENT_MODEL}
      - SENTIMENT_BATCH_SIZE=${SENTIMENT_BATCH_SIZE}
      - SENTIMENT_CACHE_RESULTS=${SENTIMENT_CACHE_RESULTS}
      - SENTIMENT_CACHE_TTL=${SENTIMENT_CACHE_TTL}
      - MODERATION_MODEL=${MODERATION_MODEL}
      - MODERATION_SELF_HARM_THRESHOLD=${MODERATION_SELF_HARM_THRESHOLD}
      - MODERATION_HARASSMENT_THRESHOLD=${MODERATION_HARASSMENT_THRESHOLD}
      - MODERATION_EXPLICIT_THRESHOLD=${MODERATION_EXPLICIT_THRESHOLD}
      - MODERATION_SPAM_THRESHOLD=${MODERATION_SPAM_THRESHOLD}
      - MODERATION_AUTO_FLAG=${MODERATION_AUTO_FLAG}
      - MODERATION_NOTIFY_ADMINS=${MODERATION_NOTIFY_ADMINS}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE}
      - EMBEDDING_SIMILARITY_THRESHOLD=${EMBEDDING_SIMILARITY_THRESHOLD}
      - EMBEDDING_SIMILARITY_METRIC=${EMBEDDING_SIMILARITY_METRIC}
      - EMBEDDING_STORAGE_ENABLED=${EMBEDDING_STORAGE_ENABLED}
      - EMBEDDING_STORAGE_PROVIDER=${EMBEDDING_STORAGE_PROVIDER}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS}
      - SEMANTIC_SEARCH_THRESHOLD=${SEMANTIC_SEARCH_THRESHOLD}
      - MAX_SEMANTIC_RESULTS=${MAX_SEMANTIC_RESULTS}
      - ENABLE_VECTOR_SEARCH=${ENABLE_VECTOR_SEARCH}
      - VECTOR_INDEX_TYPE=${VECTOR_INDEX_TYPE}
      - VECTOR_INDEX_LISTS=${VECTOR_INDEX_LISTS}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_POOL_MAX=${DB_POOL_MAX}
      - DB_IDLE_TIMEOUT=${DB_IDLE_TIMEOUT}
      - DB_CONNECTION_TIMEOUT=${DB_CONNECTION_TIMEOUT}
      - DB_QUERY_TIMEOUT=${DB_QUERY_TIMEOUT}
      - DB_STATEMENT_TIMEOUT=${DB_STATEMENT_TIMEOUT}
      - DB_SSL_ENABLED=${DB_SSL_ENABLED}
      - DB_SSL_REJECT_UNAUTHORIZED=${DB_SSL_REJECT_UNAUTHORIZED}
      - DB_CA_CERT=${DB_CA_CERT}
      - DB_CLIENT_CERT=${DB_CLIENT_CERT}
      - DB_CLIENT_KEY=${DB_CLIENT_KEY}
      - DB_MIGRATIONS_PATH=${DB_MIGRATIONS_PATH}
      - DB_MIGRATIONS_TABLE=${DB_MIGRATIONS_TABLE}
      - DB_RUN_MIGRATIONS=${DB_RUN_MIGRATIONS}
      - DISABLE_SYNC=${DISABLE_SYNC}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}

    ports:
      - '4002:4002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      auth-service:
        condition: service_started
      ollama:
        condition: service_started

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4002/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  scheduler-service:
    build:
      context: ./
      dockerfile: Dockerfile-schedule
    container_name: serenity_space_scheduler
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT_CHAT=${PORT_CHAT}
      - PORT_AUTH=${PORT_AUTH}
      - PORT_SCHEDULE=${PORT_SCHEDULE}
      - PORT_NOTIFICATION=${PORT_NOTIFICATION}
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - NOTIFICATION_SERVICE_URL= ${NOTIFICATION_SERVICE_URL}
    ports:
      - '4003:4003'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4003/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  video-service:
    build:
      context: ./
      dockerfile: Dockerfile-video
    container_name: serenity_space_video
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT_VIDEO=${PORT_VIDEO}
      - REDIS_URL=${REDIS_URL}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - TURN_SECRET=your-turn-secret-change-in-production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
    ports:
      - '4004:4004'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4004/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  mood-service:
    build:
      context: ./
      dockerfile: Dockerfile-mood
    container_name: serenity_space_mood
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT_MOOD=4005
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
    ports:
      - '4005:4005'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4005/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  notification-service:
    build:
      context: ./
      dockerfile: Dockerfile-notification
    container_name: serenity_space_notification
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT_NOTIFICATION=${PORT_NOTIFICATION}
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_SECURE=${MAIL_SECURE}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_SECRET=${JWT_SECRET}
      - PLATFORM_NAME=${PLATFORM_NAME}
    ports:
      - '4006:4006'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4006/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: serenity_space_frontend
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-nextauth-secret-change-in-production
      - GOOGLE_CLIENT_ID=your-google-client-id
      - GOOGLE_CLIENT_SECRET=your-google-client-secret
    ports:
      - '3000:3000'
    depends_on:
      - nginx
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  # Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: serenity_space_nginx
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
    ports:
      - '80:80'
      - '443:443'
      - '8080:8080' # API Gateway
    depends_on:
      - auth-service
      - chat-service
      - user-service
      - scheduler-service
      # - video-service
      # - mood-service
      - notification-service
      - prometheus
      - grafana

    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - serenity_space_network

  # Monitoring & Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: serenity_space_prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - serenity_space_network

  grafana:
    image: grafana/grafana:latest
    container_name: serenity_space_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=mentalhealth2024
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./infrastructure/grafana/dashgboards:/etc/grafana/provisioning/dashboards
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - serenity_space_network

  # Log Management
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.4
    container_name: serenity_space_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - '9200:9200'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9200']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  kibana:
    image: docker.elastic.co/kibana/kibana:9.0.4
    container_name: serenity_space_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - '5601:5601'
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - serenity_space_network

  # Development Tools
  adminer:
    image: adminer:latest
    container_name: serenity_space_adminer
    ports:
      - '8081:8080'
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - serenity_space_network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: serenity_space_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
    ports:
      - '8082:8081'
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - serenity_space_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  serenity_space_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
