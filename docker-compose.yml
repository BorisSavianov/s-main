version: '3.8'

services:
  # Database Services
  postgres:
    image: ankane/pgvector:latest
    container_name: serenity_space_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mentalhealth2024
      POSTGRES_DB: mentalhealth
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --lc-collate=C --lc-ctype=C'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infrastructure/postgres/migrations:/docker-entrypoint-initdb.d/migrations
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - serenity_space_network

  redis:
    image: redis:8-alpine
    container_name: serenity_space_redis
    command: redis-server --appendonly yes --requirepass mentalhealth2024
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - serenity_space_network

  # AI Infrastructure
  ollama:
    image: ollama/ollama:latest
    container_name: serenity_space_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - '11434:11434'
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11434/api/tags']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  # Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: serenity_space_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mentalhealth
      RABBITMQ_DEFAULT_PASS: mentalhealth2024
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
    ports:
      - '5672:5672' # AMQP port
      - '15672:15672' # Management UI
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - serenity_space_network

  # Core Backend Services
  auth-service:
    build:
      context: ./
      dockerfile: Dockerfile-auth
    container_name: serenity_space_auth
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:mentalhealth2024@postgres:5432/mentalhealth
      - REDIS_URL=redis://:mentalhealth2024@redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=24h
      - BCRYPT_ROUNDS=12
      - GOOGLE_CLIENT_ID=265701614421-9qahv7sm5ib3fqe5m904g8ql2tdf5d9g.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=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
      - GOOGLE_CALLBACK_URL=http://localhost:4000/auth/google/callback
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=465
      - SMTP_SECURE=true
      - SMTP_USER=bsavyanov@gmail.com
      - SMTP_PASS=mjuw vofq dljx cyud
      - SMTP_FROM="SerenitySpace <bsavyanov@gmail.com>"
      - FRONTEND_URL=http://localhost:4000

    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  user-service:
    build:
      context: ./apps/user-service
      dockerfile: Dockerfile
    container_name: serenity_space_user
    environment:
      - NODE_ENV=development
      - PORT=4001
      - DATABASE_URL=postgresql://postgres:mentalhealth2024@postgres:5432/mentalhealth
      - REDIS_URL=redis://:mentalhealth2024@redis:6379
      - AUTH_SERVICE_URL=http://auth-service:4000
    ports:
      - '4001:4001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  chat-service:
    build:
      context: ./
      dockerfile: Dockerfile-chat
    container_name: serenity_space_chat
    environment:
      - NODE_ENV=development
      - PORT=4002
      - DATABASE_URL=postgresql://postgres:mentalhealth2024@postgres:5432/mentalhealth
      - REDIS_URL=redis://:mentalhealth2024@redis:6379
      - RABBITMQ_URL=amqp://mentalhealth:mentalhealth2024@rabbitmq:5672
      - AUTH_SERVICE_URL=http://auth-service:4000
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_SECURE=false
      - SMTP_USER=bsavyanov@gmail.com
      - SMTP_PASS=mjuw vofq dljx cyud
      - MAIL_FROM_NAME=SerenitySpace
      - MAIL_FROM_ADDRESS=bsavyanov@gmail.com
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - REDIS_PASSWORD=mentalhealth2024
      - REDIS_DB=0
      - REDIS_KEY_PREFIX=chat_service
      - REDIS_BULL_DB=1
      - REDIS_SESSION_DB=2
      - REDIS_CACHE_DB=3
      - REDIS_TLS_ENABLED=false
      - REDIS_TLS_REJECT_UNAUTHORIZED=true
      - REDIS_TLS_CA=
      - REDIS_TLS_CERT=
      - REDIS_TLS_KEY=
      - REDIS_SENTINEL_HOSTS=sentinel1:26379,sentinel2:26379,sentinel3:26379
      - REDIS_SENTINEL_ENABLED=false
      - REDIS_SENTINEL_MASTER_NAME=mymaster
      - AI_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_DEFAULT_MODEL=llama3.1:8b
      - OLLAMA_TIMEOUT=30000
      - OLLAMA_MAX_RETRIES=3
      - OLLAMA_CHAT_MODEL=llama3.1:8b
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - OLLAMA_SENTIMENT_MODEL=llama3.1:8b
      - OLLAMA_MODERATION_MODEL=llama3.1:8b
      - OLLAMA_TEMPERATURE=0.7
      - OLLAMA_TOP_P=0.9
      - OLLAMA_MAX_TOKENS=256
      - OLLAMA_STOP_TOKENS=
      - OPENAI_API_KEY=your_openai_api_key
      - OPENAI_BASE_URL=https://api.openai.com/v1
      - OPENAI_ORGANIZATION=
      - OPENAI_CHAT_MODEL=gpt-3.5-turbo
      - OPENAI_EMBEDDING_MODEL=text-embedding-ada-002
      - OPENAI_MODERATION_MODEL=text-moderation-latest
      - OPENAI_MAX_TOKENS=1000
      - OPENAI_TEMPERATURE=0.7
      - AI_SENTIMENT_ANALYSIS=true
      - AI_CONTENT_MODERATION=true
      - AI_SESSION_SUMMARY=true
      - AI_RECOMMENDATIONS=true
      - AI_EMBEDDING=false
      - AI_TOPIC_EXTRACTION=true
      - AI_MAX_MESSAGE_LENGTH=4000
      - AI_MAX_SESSION_DURATION=120
      - AI_MAX_MESSAGES_PER_SESSION=100
      - AI_RATE_LIMIT_PER_MINUTE=20
      - AI_SYSTEM_PROMPT=
      - AI_SENTIMENT_PROMPT=
      - AI_MODERATION_PROMPT=
      - AI_SUMMARY_PROMPT=
      - AI_RECOMMENDATION_PROMPT=
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=4000
      - RABBITMQ_URL=amqp://localhost:5672
      - THROTTLE_SHORT_LIMIT=10
      - THROTTLE_MEDIUM_LIMIT=50
      - THROTTLE_LONG_LIMIT=200
      - SENTIMENT_MODEL=llama3.2:1b
      - SENTIMENT_BATCH_SIZE=10
      - SENTIMENT_CACHE_RESULTS=true
      - SENTIMENT_CACHE_TTL=3600
      - MODERATION_MODEL=llama3.2:1b
      - MODERATION_SELF_HARM_THRESHOLD=0.8
      - MODERATION_HARASSMENT_THRESHOLD=0.8
      - MODERATION_EXPLICIT_THRESHOLD=0.8
      - MODERATION_SPAM_THRESHOLD=0.8
      - MODERATION_AUTO_FLAG=true
      - MODERATION_NOTIFY_ADMINS=false
      - EMBEDDING_MODEL=nomic-embed-text
      - EMBEDDING_BATCH_SIZE=100
      - EMBEDDING_SIMILARITY_THRESHOLD=0.8
      - EMBEDDING_SIMILARITY_METRIC=cosine
      - EMBEDDING_STORAGE_ENABLED=false
      - EMBEDDING_STORAGE_PROVIDER=postgres
      - EMBEDDING_DIMENSIONS=768
      - SEMANTIC_SEARCH_THRESHOLD=0.7
      - MAX_SEMANTIC_RESULTS=10
      - ENABLE_VECTOR_SEARCH=true
      - VECTOR_INDEX_TYPE=ivfflat
      - VECTOR_INDEX_LISTS=100
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=mentalhealth2024
      - DB_NAME=mentalhealth
      - DB_POOL_MAX=20
      - DB_IDLE_TIMEOUT=30000
      - DB_CONNECTION_TIMEOUT=2000
      - DB_QUERY_TIMEOUT=60000
      - DB_STATEMENT_TIMEOUT=60000
      - DB_SSL_ENABLED=false
      - DB_SSL_REJECT_UNAUTHORIZED=true
      - DB_CA_CERT=
      - DB_CLIENT_CERT=
      - DB_CLIENT_KEY=
      - DB_MIGRATIONS_PATH=src/migrations/**/*{.ts,.js}
      - DB_MIGRATIONS_TABLE=migrations
      - DB_RUN_MIGRATIONS=false
      - DISABLE_SYNC=true
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=24h
      - GOOGLE_CLIENT_ID=265701614421-9qahv7sm5ib3fqe5m904g8ql2tdf5d9g.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=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
      - GOOGLE_CALLBACK_URL=http://localhost:4000/auth/google/callback

    ports:
      - '4002:4002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4002/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  scheduler-service:
    build:
      context: ./apps/scheduler-service
      dockerfile: Dockerfile
    container_name: serenity_space_scheduler
    environment:
      - NODE_ENV=development
      - PORT=4003
      - DATABASE_URL=postgresql://postgres:mentalhealth2024@postgres:5432/mentalhealth
      - REDIS_URL=redis://:mentalhealth2024@redis:6379
      - RABBITMQ_URL=amqp://mentalhealth:mentalhealth2024@rabbitmq:5672
      - AUTH_SERVICE_URL=http://auth-service:4000
      - NOTIFICATION_SERVICE_URL=http://notification-service:4006
    ports:
      - '4003:4003'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4003/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  video-service:
    build:
      context: ./apps/video-service
      dockerfile: Dockerfile
    container_name: serenity_space_video
    environment:
      - NODE_ENV=development
      - PORT=4004
      - REDIS_URL=redis://:mentalhealth2024@redis:6379
      - AUTH_SERVICE_URL=http://auth-service:4000
      - TURN_SECRET=your-turn-secret-change-in-production
    ports:
      - '4004:4004'
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4004/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  mood-service:
    build:
      context: ./apps/mood-service
      dockerfile: Dockerfile
    container_name: serenity_space_mood
    environment:
      - NODE_ENV=development
      - PORT=4005
      - DATABASE_URL=postgresql://postgres:mentalhealth2024@postgres:5432/mentalhealth
      - REDIS_URL=redis://:mentalhealth2024@redis:6379
      - AUTH_SERVICE_URL=http://auth-service:4000
    ports:
      - '4005:4005'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4005/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  notification-service:
    build:
      context: ./apps/notification-service
      dockerfile: Dockerfile
    container_name: serenity_space_notification
    environment:
      - NODE_ENV=development
      - PORT=4006
      - REDIS_URL=redis://:mentalhealth2024@redis:6379
      - RABBITMQ_URL=amqp://mentalhealth:mentalhealth2024@rabbitmq:5672
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=your-email@gmail.com
      - SMTP_PASS=your-app-password
      - FROM_EMAIL=support@mentalhealth.app
    ports:
      - '4006:4006'
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4006/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: serenity_space_frontend
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-nextauth-secret-change-in-production
      - GOOGLE_CLIENT_ID=your-google-client-id
      - GOOGLE_CLIENT_SECRET=your-google-client-secret
    ports:
      - '3000:3000'
    depends_on:
      - nginx
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  # Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: serenity_space_nginx
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
    ports:
      - '80:80'
      - '443:443'
      - '8080:8080' # API Gateway
    depends_on:
      - auth-service
      - chat-service
      - scheduler-service
      - video-service
      - mood-service
      - notification-service
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - serenity_space_network

  # Monitoring & Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: serenity_space_prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - serenity_space_network

  grafana:
    image: grafana/grafana:latest
    container_name: serenity_space_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=mentalhealth2024
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - serenity_space_network

  # Log Management
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.4
    container_name: serenity_space_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - '9200:9200'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9200']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - serenity_space_network

  kibana:
    image: docker.elastic.co/kibana/kibana:9.0.4
    container_name: serenity_space_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - '5601:5601'
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - serenity_space_network

  # Development Tools
  adminer:
    image: adminer:latest
    container_name: serenity_space_adminer
    ports:
      - '8081:8080'
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - serenity_space_network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: serenity_space_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379
      - REDIS_PASSWORD=mentalhealth2024
    ports:
      - '8082:8081'
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - serenity_space_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  ollama_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  serenity_space_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
