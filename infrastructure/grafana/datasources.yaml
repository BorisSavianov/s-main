apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    isDefault: false
    editable: true
    database: '[logstash-]YYYY.MM.DD'
    jsonData:
      esVersion: '8.0.0'
      timeField: '@timestamp'
      timeInterval: '10s'
      maxConcurrentShardRequests: 5
