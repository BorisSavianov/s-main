# Require authentication
requirepass ${REDIS_PASSWORD}

# Only bind to the container's network interface
bind 0.0.0.0

# Enable TLS
tls-port 6379
port 0
tls-cert-file /usr/local/etc/redis/ssl/redis.crt
tls-key-file /usr/local/etc/redis/ssl/redis.key
tls-ca-cert-file /usr/local/etc/redis/ssl/ca.crt
tls-auth-clients no

# Append-only file for persistence
appendonly yes

# Disable dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN ""

# Other security
protected-mode yes
