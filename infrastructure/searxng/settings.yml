# /etc/searxng/settings.yml

general:
  debug: false
  instance_name: 'SerenitySpace Search'
  default_lang: 'en'

server:
  secret_key: '${SEARXNG_SECRET}'
  host: '0.0.0.0'
  port: 8080
  limiter: false
  image_proxy: true
  allowed_hosts:
    - 'localhost'
    - '127.0.0.1'
    - 'searxng'
    - ''

search:
  safe_search: 1
  autocomplete: 'google'

ui:
  static_use_hash: true
  default_locale: 'en'
  theme_args:
    simple_style: 'dark'

engines:
  - name: 'google'
    disabled: false
  - name: 'duckduckgo'
    disabled: false
  - name: 'wikipedia'
    disabled: false
  - name: 'bing'
    disabled: false

formats:
  - 'html'
  - 'json'

enabled_plugins:
  - 'Hash plugin'
  - 'Self Information'
  - 'Tracker URL remover'

enable_http: false

# Disable bot detection for internal Docker network calls
bot_detection:
  enabled: false

use_default_settings: true
