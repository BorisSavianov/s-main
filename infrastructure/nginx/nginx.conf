user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log json;

    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Upstream definitions
    upstream auth_backend {
        least_conn;
        server auth-service:4000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream user_backend {
        least_conn;
        server user-service:4001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream chat_backend {
        least_conn;
        server chat-service:4002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream scheduler_backend {
        least_conn;
        server scheduler-service:4003 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # upstream video_backend {
    #     least_conn;
    #     server video-service:4004 max_fails=3 fail_timeout=30s;
    #     keepalive 32;
    # }

    # upstream mood_backend {
    #     least_conn;
    #     server mood-service:4005 max_fails=3 fail_timeout=30s;
    #     keepalive 32;
    # }

    upstream notification_backend {
        least_conn;
        server notification-service:4006 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # upstream frontend_backend {
    #     least_conn;
    #     server frontend:3000 max_fails=3 fail_timeout=30s;
    #     keepalive 32;
    # }

    # Include additional configurations
    include /etc/nginx/conf.d/*.conf;
}