name: CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20.x'

jobs:
  # Only run if CI passed successfully
  check-ci-status:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'push'
